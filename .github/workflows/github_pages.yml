name: GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  analyze-bundle:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Analyze bundle
        run: pnpm analyze --no-serve
      - name: Collect pages bundle
        run: |
          mkdir -p out
          cp node_modules/.cache/nuxt/.nuxt/analyze/client.html out/analysis.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4
